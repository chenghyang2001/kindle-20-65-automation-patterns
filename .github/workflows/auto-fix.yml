# 自動修復工作流
# 當 "Run Tests" 工作流失敗時觸發，呼叫 auto-fix.sh 嘗試自動修復
# 使用 workflow_run 觸發而非直接事件，避免遞迴觸發
name: Auto Fix

on:
  workflow_run:
    # 此名稱必須與 run-tests.yml 的 name 欄位完全相符
    workflows: ["Run Tests"]
    types: [completed]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    # 僅在 Run Tests 失敗且來源為本儲存庫時才執行修復
    # 過濾 fork PR：fork 的 head_repository.full_name 與 github.repository 不符，
    # 若允許 fork 觸發，外部攻擊者可藉此以 contents: write 權限執行惡意程式碼
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      actions: read

    steps:
      # 使用 PAT 或 GITHUB_TOKEN checkout，讓後續 git push 有寫入權限
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 取得觸發失敗的那個分支的最新 commit
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      # 下載 Run Tests 工作流儲存的失敗輸出 artifact
      - name: Download test output artifact
        uses: actions/download-artifact@v4
        with:
          name: test-output
          # 將 artifact 下載到工作目錄
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      # 若 artifact 不存在則建立空的測試輸出檔
      - name: Ensure test-output.txt exists
        run: |
          if [ ! -f test-output.txt ]; then
            echo "無法取得測試輸出，使用空白內容" > test-output.txt
          fi

      # 安裝 Claude Code CLI
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # 執行自動修復腳本
      - name: Run Auto Fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/auto-fix.sh
